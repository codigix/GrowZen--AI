# A throw-away PostgreSQL for running the backend test suite against the real production database engine:
#   docker compose -f docker-compose.test.yml up -d
#   cd backend
#   TEST_DATABASE_URL=postgresql+psycopg://seo:seo_test_pw@localhost:55432/seo_test python -m pytest
#   docker compose -f docker-compose.test.yml down -v
# The test suite creates and DROPS tables, so it refuses any database whose name does not contain "test".
services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: seo
      POSTGRES_PASSWORD: seo_test_pw
      POSTGRES_DB: seo_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data   # nothing is kept between runs
